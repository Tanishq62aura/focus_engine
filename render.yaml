services:
  - type: web
    name: focus-engine
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.9"
